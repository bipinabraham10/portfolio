<nav class="rail" aria-label="Section navigation">
  <div class="rail-top">
    <span class="rail-logo">BA</span>
  </div>

  <div class="rail-track" aria-hidden="true">
    <div class="rail-progress" id="rail-progress"></div>
  </div>

  <ol class="rail-list">
    {% for section in nav_sections %}
    <li class="rail-item">
      <a href="#{{ section.id }}" class="rail-link" data-section="{{ section.id }}">
        <span class="rail-dot"></span>
        <span class="rail-text">{{ section.label }}</span>
      </a>
    </li>
    {% endfor %}
  </ol>

  <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
    <span class="theme-toggle-track">
      <span class="theme-toggle-thumb" aria-hidden="true">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
      </span>
    </span>
  </button>
</nav>

<div class="mobile-topbar">
  <span class="rail-logo">BA</span>
  <div class="mobile-progress-track" aria-hidden="true">
    <div class="mobile-progress" id="mobile-progress"></div>
  </div>
  <button type="button" id="theme-toggle-mobile" class="theme-toggle theme-toggle--mobile" aria-label="Toggle dark mode" aria-pressed="false">
    <span class="theme-toggle-track">
      <span class="theme-toggle-thumb" aria-hidden="true">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
      </span>
    </span>
  </button>
</div>
